serenity {
  project.name = "Pokedex Automation UI"
  take.screenshots = FOR_FAILURES
}

pages {
  home = "http://127.0.0.1:5500"
}

# Navegador visible por defecto; para CI: -Dheadless.mode=true
headless.mode = false

webdriver {
  timeouts {
    implicitlywait = 0
    fluentwait = 10000
  }
}

environments {

  chrome {
    webdriver {
      driver = chrome
      capabilities {
        browserName = "chrome"
        acceptInsecureCerts = true
        "goog:chromeOptions" {
          args = ["start-maximized", "window-size=1920,1080", "test-type",
                  "ignore-certificate-errors", "disable-popup-blocking", "incognito"]
        }
      }
    }
  }

  edge {
    webdriver {
      driver = edge
      capabilities {
        browserName = "MicrosoftEdge"
        acceptInsecureCerts = true
        "ms:edgeOptions" {
          args = ["start-maximized", "window-size=1920,1080", "test-type",
                  "ignore-certificate-errors", "disable-popup-blocking", "inprivate"]
        }
      }
    }
  }

  firefox {
    webdriver {
      driver = firefox
      capabilities {
        browserName = "firefox"
        acceptInsecureCerts = true
        "moz:firefoxOptions" {
          args = ["-private", "-width=1920", "-height=1080"]
        }
      }
    }
  }

  safari {
    webdriver {
      driver = safari
    }
  }
}